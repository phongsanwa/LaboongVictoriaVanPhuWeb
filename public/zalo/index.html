<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Laboong · Zalo Mini App</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="hdr">
      <div class="hdr-in">
        <div class="brand">
          <span class="brand-logo">L</span>
          <div>
            <div class="brand-name">Laboong</div>
            <div class="brand-sub">Victoria Văn Phú</div>
          </div>
        </div>
        <button class="hdr-store" id="storeBtn"><span class="pin">📍</span> <span id="storeName">Chọn quán</span></button>
      </div>
    </header>

    <!-- Screens -->
    <main id="screen-menu" class="screen">
      <div class="intro">
        <h1 id="greet">Xin chào 👋</h1>
        <p>Đặt trà sữa yêu thích, tích điểm mỗi ly.</p>
      </div>
      <div class="searchbar">
        <span class="si">🔍</span>
        <input id="search" type="search" placeholder="Tìm món…" />
      </div>
      <div class="cats" id="cats"></div>
      <div id="menuList"></div>
    </main>

    <main id="screen-orders" class="screen" hidden>
      <div class="intro"><h1>Đơn hàng của bạn</h1></div>
      <div id="ordersList" class="orders-wrap"></div>
    </main>

    <main id="screen-account" class="screen" hidden>
      <div id="accountBody"></div>
    </main>

    <!-- Bottom nav -->
    <nav class="botnav">
      <button class="bn on" data-screen="menu"><span>🧋</span>Thực đơn</button>
      <button class="bn" data-screen="orders"><span>🧾</span>Đơn hàng</button>
      <button class="bn" data-screen="account"><span>👤</span>Tài khoản</button>
    </nav>

    <!-- Cart bar -->
    <div class="cartbar" id="cartbar" hidden>
      <div class="cb-ic">🛍️<span class="cb-badge" id="cbCount">0</span></div>
      <div class="cb-info">
        <div class="cb-count" id="cbSummary">0 món</div>
        <div class="cb-total" id="cbTotal">0đ</div>
      </div>
      <button class="cb-go">Xem giỏ →</button>
    </div>
  </div>

  <!-- Overlays mount here -->
  <div id="overlay"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
