<div class="rewards p-2">
  <div class="rewards-card">
    <header class="card-head">
      <span class="head-icon" aria-hidden="true">★</span>
      <h2>Lợi ích thành viên</h2>
    </header>

    <ul class="benefit-list" role="list">
      @for (b of benefits; track b.title) {
        <li class="benefit-row">
          <span class="benefit-title">{{ b.title }}</span>
          <strong class="benefit-points">{{ b.points | i18nInteger }} điểm</strong>
        </li>
      }
    </ul>
  </div>

  <div class="voucher-wrap px-3">
    <h3 class="section-title mt-2">Mã giảm giá</h3>
    @if (vouchers) {
      @for (v of vouchers; track v.code) {
        <app-voucher-card
          [title]="v.title"
          [expiry]="v.expire"
          [description]="v.description"
          [cta]="'Dùng ngay'"
          (apply)="onApplyVoucher(v.code)">
        </app-voucher-card>
      }
    }
  </div>
</div>
