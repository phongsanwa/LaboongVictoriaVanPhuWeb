<div class="page-user-edit">
  <div class="personal-info-block">
    <form class="personal-info-form">
      <div class="form-group">
          <label>Họ & tên</label>
          <input [value]="userInfo && userInfo.name ? userInfo.name : ''" type="search" id="fullname" class="form-control"
                 />
      </div>

      <div class="form-group">
        <label>Số điện thoại</label>
        <input [value]="userInfo && userInfo.phoneNumber ? userInfo.phoneNumber : ''" type="text" id="phone"
                 class="form-control" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" class="form-control" />
      </div>

      <div class="form-group">
        <label>Ngày sinh</label>
        <input type="date" id="birthday" class="form-control"/>
      </div>

      <div class="form-group">
        <label>Giới tính</label>
        <div class="gender-group p-2 d-flex justify-content-end">
          <label><input type="radio" name="gender" value="male"/> Nam</label>
          <label><input type="radio" name="gender" value="female"/> Nữ</label>
        </div>
      </div>
    </form>
  </div>
</div>
<div class="position-fixed bottom-0 w-100 px-2 pb-4">
  <button type="submit" class="btn-save">Lưu thay đổi</button>
</div>
