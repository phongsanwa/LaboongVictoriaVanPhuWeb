<div class="address-screen bg-light h-100">
  <div class="h-fit-content">
    <div class="bg-white p-2 mb-1">
      <i class="text-brand-color text-end d-block w-100">Địa chỉ của tôi</i>
    </div>
    <!-- Trạng thái CHƯA có địa chỉ -->
    @if (!hasCustomer()) {
      <div class="bg-white p-4 text-center mb-1">
        <i class="ph-bold ph-info h1 text-gray mb-0"></i>
        <div class="text-muted">Chưa có dữ liệu</div>
      </div>
    }

    @if (hasCustomer()) {
      <div class="bg-white mb-1">
        @for (item of customerSer.getAll(); track item.id) {
          <div (click)="onActiveAddress(item)" class="address-card px-2 py-3 border-bottom position-relative"
               [style]="!item.isDefault ? 'border: none' : ''"
               role="button" tabindex="0">
            <div class="addr-body">
              <div class="addr-name fw-bold mb-2 d-flex gap-1 align-items-center">
                {{ item.name }}
                @if (item.isDefault) {
                <div class="border-brand-color text-brand-color p-1 text-small fw-normal">Mặc định</div>
                }
                <div class="d-flex gap-2 align-items-center text-gray text-small ms-auto fw-normal">
                  <i (click)="editAddress(item)" class="ph-bold ph-pencil-simple"></i>
                  Chỉnh sửa
                </div>
              </div>
              <div class="addr-phone text-muted">{{ item.mobile }}</div>
              <div class="addr-line text-muted text-wrap mt-2 text-middle">
                {{ fullAddress(item) }}
              </div>
            </div>
          </div>
        }
      </div>
    }
    <div class="p-2 bg-white">
      <button (click)="addAddressModal()" type="button" class="text-middle btn-add-address
        w-100 py-1 btn text-brand-color d-flex gap-1 align-items-center justify-content-center">
        <i class="ph-bold ph-plus-circle text-small"></i> Thêm địa chỉ mới
      </button>
    </div>
  </div>
</div>
