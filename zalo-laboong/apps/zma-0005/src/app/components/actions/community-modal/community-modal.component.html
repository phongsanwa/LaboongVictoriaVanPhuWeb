<div class="modal-header d-flex align-items-center gap-2 px-3 py-2">
  <div [routerLink]="uriFeConst.home" class="logo">
    <img
      class="rounded-1"
      src="https://dummyimage.com/27x27/fff/000"
      alt="Logo"
    />
  </div>
  <div class="w-60">Mini Shop - Mua sắm đơn giản</div>
  <i class="ph-light ph-x ms-auto" (click)="activeModal.dismiss('close')"></i>
</div>
<div class="d-block px-2 py-1 fw-semibold">Cộng đồng</div>
<div class="community d-flex align-items-center gap-2 px-3 py-2 bg-light">
  <img
    class="rounded-1"
    src="https://dummyimage.com/27x27/fff/000"
    alt="Logo"
  />
  <div>
    <div class="d-flex gap-1 text-small ">
      <div class="text-muted">8041</div>
      <span class="text-brand-color fw-semibold">#Shop</span>
    </div>
    <div class="fw-semibold">Mini Store</div>
  </div>
  <i class="ph-bold ph-dots-three-vertical ms-auto"></i>
</div>
<div class="modal-footer w-100 shadow-md px-3 py-2">
  <p class="w-100">
    <i class="ph-bold ph-users me-1"></i> Tham gia cộng đồng
  </p>
  <p class="w-100">
    <i class="ph-light ph-plus-circle me-1"></i> Tạo mới cộng đồng
  </p>
</div>
