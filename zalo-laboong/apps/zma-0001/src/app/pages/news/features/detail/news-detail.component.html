@if (newsDetail) {
  <div class="page-news-detail px-2">
    @if (newsDetail.avatarUri) {
      <img class="w-100 mb-2" src="{{ newsDetail.avatarUri }}" alt="{{ newsDetail.title }}">
    }
    <h1 class="news-title mb-0">
      {{ newsDetail.title }}
    </h1>
    <span class="text-muted small">
      <i class="ph-light ph-calendar"></i>
      {{ newsDetail.publishedDate | date:'dd/MM/yyyy' }}
    </span>
    <div class="mt-1" [innerHTML]="newsDetail.content">
    </div>
  </div>
}
