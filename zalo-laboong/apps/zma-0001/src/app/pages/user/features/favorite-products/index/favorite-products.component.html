@if (!lists.length) {
  <div class="text-center text-muted py-4">
    Chưa có danh sách yêu thích nào.
  </div>
}

@for (l of lists; track l.id) {
  <div class="card list-card mb-3">
    <div class="card-body p-3">
      <div class="d-flex align-items-center">
        <div class="d-flex align-items-center flex-grow-1 gap-2"
             [routerLink]="uriFeConst.user.favoriteProductsDetail"
             [queryParams]="{ id: l.id }">
          <i class="ph-bold ph-heart list-icon"></i>
          <span class="list-title">
 {{ l.name }}
            <small class="text-muted ms-2">({{ (l.data?.length || 0) }} sản phẩm)</small>
 </span>
        </div>

        <div ngbDropdown class="dropdown" placement="bottom-end" [container]="'body'">
          <button
            class="btn btn-actions rounded-circle"
            type="button"
            ngbDropdownToggle
            aria-haspopup="true"
            aria-expanded="false">
            <i class="ph-bold ph-dots-three-vertical"></i>
          </button>

          <div ngbDropdownMenu class="dropdown-menu dropdown-menu-end">
            <button ngbDropdownItem type="button" (click)="renameList(l)">
              <i class="ph-bold ph-pencil-simple"></i> Sửa tên
            </button>

            <!-- <button ngbDropdownItem type="button" (click)="shareList(l)">-->
            <!-- <i class="ph-bold ph-share-fat"></i> Chia sẻ-->
            <!-- </button>-->

            <div class="dropdown-divider"></div>

            <button ngbDropdownItem type="button" class="text-danger" (click)="deleteList(l)">
              <i class="ph-bold ph-trash"></i> Xóa danh sách
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
}
