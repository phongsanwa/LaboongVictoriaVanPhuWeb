@if (products && products.length) {
  <div class="d-flex align-items-center justify-content-between px-2">
    <div class="d-flex gap-2 align-items-center pt-2 pb-2 truncate fw-bold fs-6">
      <!--    {{ promotionData?.promotion?.name || 'Flash Sale' }}-->
      Flash Sale
      <div class="end-time d-flex align-items-center gap-2">
        <div class="text-muted fs-10 text-normal">Kết thúc trong</div>
        <div class="count-down d-flex">
          <div>{{ timeLeft.hours }}</div>
          <span>:</span>
          <div>{{ timeLeft.minutes }}</div>
          <span>:</span>
          <div>{{ timeLeft.seconds }}</div>
        </div>
      </div>
    </div>

    <a class="text-sm font-medium flex items-center space-x-1 p-2 cursor-pointer flex-none"
       [routerLink]="'/product'">
      <span>Xem thêm</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path fill-rule="evenodd" clip-rule="evenodd"
              d="M5.64642 2.64297C5.84168 2.44771 6.15826 2.44771 6.35352 2.64297L11.3535 7.64297C11.5488 7.83823 11.5488 8.15481 11.3535 8.35007L6.35352 13.3501C6.15826 13.5453 5.84168 13.5453 5.64642 13.3501C5.45115 13.1548 5.45115 12.8382 5.64642 12.643L10.2929 7.99652L5.64642 3.35007C5.45115 3.15481 5.45115 2.83823 5.64642 2.64297Z"
              fill="currentColor"></path>
      </svg>
    </a>
  </div>

  <div class="px-2 py-2">
    <app-universal-slide [items]="products" [config]="{ slidesPerView: 2, spaceBetween: 12 }">
      <ng-template let-prd>
        <app-product-item [productInList]="prd"></app-product-item>
      </ng-template>
    </app-universal-slide>
  </div>
}
