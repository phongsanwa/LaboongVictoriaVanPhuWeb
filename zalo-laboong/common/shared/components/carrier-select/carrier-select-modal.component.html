<div class="modal-header py-2 bg-light border-bottom-0">
  <h5 class="modal-title">Chọn đơn vị vận chuyển</h5>
  <button type="button" aria-label="Close" class="btn-close" (click)="modal.dismiss()"></button>
</div>

<div class="modal-body">
  <div class="carrier-list d-flex flex-column gap-2">
    @for (cr of options; track cr.serviceId) {
      <label class="carrier-item d-flex align-items-center justify-content-between p-2 rounded"
             [ngClass]="{ 'active': selected?.serviceId === cr.serviceId }"
             (click)="onSelectCarrier(cr)">
        <div class="d-flex align-items-center gap-2">
          <div class="fw-semibold">
            <img [src]="cr.logo" [alt]="cr.carrierName" class="carrier-logo">
          </div>
          <div>
            <div class="fw-semibold small">{{ cr.serviceName }}</div>
            <div class="text-muted small">{{ cr.serviceDescription }}</div>
          </div>
        </div>
        <div class="carrier-fee fw-bold">
          {{ cr.customerShipFee | i18nCurrencyAmount : { showSymbol: true } }}
        </div>
      </label>
    }
    @empty {
      <div class="text-muted text-center">Chưa có gói vận chuyển khả dụng</div>
    }
  </div>
</div>

<div class="modal-footer py-2 px-3 bg-light m-0 border-top-0">
  <button type="button" class="btn btn-sm fw-semibold btn-success" (click)="onApply()">Xác nhận</button>
</div>
