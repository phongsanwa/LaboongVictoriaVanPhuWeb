<form class="sheet" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="sheet-header d-flex align-items-center py-3 px-2">
    <button type="button" class="btn btn-link text-dark px-2" (click)="onClose()">
      <i class="ph-light ph-arrow-left ph-lg"></i>
    </button>
    <div class="flex-1 text-center fw-semibold">Thêm địa chỉ</div>
    <div style="width:40px"></div>
  </div>

  <div class="sheet-body p-2">

    <!-- Họ và tên -->
    <div class="form-floating form-control-feedback mb-3">
      <input
        type="text"
        class="form-control showPlaceholder"
        [ngClass]="{ 'ng-error': showError('name') }"
        formControlName="name"
        placeholder=""/>
      <label>Họ và tên <span class="text-danger">*</span></label>

      @if (showError('name')) {
        <small class="text-danger d-block mt-1">{{ errorMsg('name') }}</small>
      }
    </div>

    <!-- Số điện thoại -->
    <div class="form-floating form-control-feedback mb-3">
      <input
        id="mobile"
        name="mobile"
        type="tel"
        class="form-control"
        [ngClass]="{ 'ng-error': showError('mobile') }"
        formControlName="mobile"
        maxlength="11"
        inputmode="numeric"
        autocomplete="tel"
        placeholder="Số điện thoại" />
      <label for="mobile">Số điện thoại <span class="text-danger">*</span></label>

      @if (showError('mobile')) {
        <small class="text-danger d-block mt-1">{{ errorMsg('mobile') }}</small>
      }
    </div>

    <!-- Tỉnh / Quận / Phường -->
    <div class="mb-3">
      <app-location-dynamic
        class="w-100"
        [config]="{ placeholderInput: 'Tỉnh/Thành phố, Quận/Huyện, Phường/Xã' }"
        [styles]="{ 'min-width': '330px', 'max-width': '100%' }"
        [cityId]="selectedCityId"
        [districtId]="selectedDistrictId"
        [wardId]="selectedWardId"
        (valueChange)="onLocationPicked($event)"
      />

      @if (locationErrorMessage) {
        <small class="text-danger d-block mt-1">
          {{ locationErrorMessage }}
        </small>
      }
    </div>

    <!-- Địa chỉ cụ thể -->
    <div class="form-floating form-control-feedback mb-3">
      <input
        type="text"
        class="form-control showPlaceholder"
        [ngClass]="{ 'ng-error': showError('address') }"
        formControlName="address"
        placeholder=""/>
      <label>Địa chỉ cụ thể (Số nhà, Tên tòa nhà, Tên đường, Tên khu vực) <span class="text-danger">*</span></label>

      @if (showError('address')) {
        <small class="text-danger d-block mt-1">{{ errorMsg('address') }}</small>
      }
    </div>

    <div class="d-flex align-items-center py-2 my-2">
      <div class="form-check form-switch m-0">
        <input id="isDefault" class="form-check-input" type="checkbox" formControlName="isDefault">
      </div>
      <span class="fw-semibold">Đặt làm địa chỉ mặc định</span>
    </div>
  </div>

  <div class="sheet-footer d-flex gap-2 px-2">
    <button type="button" class="btn btn-light flex-fill py-2 fw-semibold" (click)="onClose()">Đóng</button>
    <button type="submit" class="btn btn-primary btn-create__address flex-fill py-2 fw-semibold">Thêm mới</button>
  </div>
</form>
